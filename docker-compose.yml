version: '3.9'

# ─────────────────────────────────────────────────────────────
#  FaceSearch — docker-compose (local dev + CI)
#  Services: postgres, redis, kafka, minio, api-gateway,
#            face-service, worker, web, nginx
# ─────────────────────────────────────────────────────────────


services:

  # ── Infrastructure ─────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: facesearch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: facerecog
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d facerecog"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - facesearch

  redis:
    image: redis:7-alpine
    container_name: facesearch_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - facesearch

  # Kafka in KRaft mode (no Zookeeper)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: facesearch_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - facesearch

  minio:
    image: minio/minio:latest
    container_name: facesearch_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - facesearch

  # ── Application Services ───────────────────────────────────

  face-service:
    build:
      context: ./apps/face-service
      dockerfile: Dockerfile
    container_name: facesearch_face_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/facerecog
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MODEL_NAME: buffalo_l
      LOG_LEVEL: info
    volumes:
      - face_models:/root/.insightface
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - facesearch

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: facesearch_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/facerecog
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: facesearch-workers
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: images
      FACE_SERVICE_URL: http://face-service:8000
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      face-service:
        condition: service_started
    networks:
      - facesearch

  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    container_name: facesearch_api_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/facerecog
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KAFKA_BROKERS: kafka:29092
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: images
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: 7d
      FACE_SERVICE_URL: http://face-service:8000
      CORS_ORIGINS: http://localhost:3001
      THROTTLE_TTL: "60"
      THROTTLE_LIMIT: "100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - facesearch

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    container_name: facesearch_web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      PORT: "3001"
    depends_on:
      - api-gateway
    networks:
      - facesearch

  nginx:
    image: nginx:1.25-alpine
    container_name: facesearch_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - web
    networks:
      - facesearch

# ── Volumes ──────────────────────────────────────────────────

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  face_models:   # cache downloaded InsightFace models

# ── Networks ─────────────────────────────────────────────────

networks:
  facesearch:
    driver: bridge
